# Hub deployment — run this on the machine that serves the dashboard
# (the Raspberry Pi). It monitors its own hardware and aggregates every agent
# registered through the UI.
#
# To add another machine, deploy docker-compose.agent.yml there and register it
# at Manage nodes in the dashboard.

services:
  backend:
    build: ./backend
    container_name: homelab-portal-backend
    restart: unless-stopped
    network_mode: host
    pid: "host" # see all host processes, not just the container's
    volumes:
      # Container monitoring and control
      - /var/run/docker.sock:/var/run/docker.sock
      # Temperature: thermal zones (Pi / ARM) and hwmon (AMD / Intel)
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /sys/class/net:/sys/class/net:ro
      # Host processes
      - /proc:/host/proc:ro
      # Username resolution for the process list
      - /etc/passwd:/etc/passwd:ro
      # Host root, read-only, for universal disk detection
      - /:/host:ro
      # Node registry and service links
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
      - NODE_ROLE=hub
      - PORT=3001
      - DB_PATH=/app/data/homelab.db
      - HOST_PROC=/host/proc
      - HOST_ROOT=/host
      # Name this machine shows as in the fleet. Defaults to the hostname.
      # - NODE_ID=pi5
      # - NODE_NAME=Raspberry Pi 5
    privileged: false

  frontend:
    build: ./frontend
    container_name: homelab-portal-frontend
    restart: unless-stopped
    ports:
      - "1781:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    networks:
      - homelab-network

networks:
  homelab-network:
    driver: bridge

volumes:
  backend-data:
